build:
  gpu: true
  python_version: "3.12"
  python_packages:
    - torch==2.8.0
    - numpy>=1.24
    - einops>=0.4
    - mido>=1.3
    - packaging>=20.0
    - safetensors>=0.4
    - huggingface_hub>=0.13
    - soundfile>=0.14.0
    - beat-this>=1.1
  run:
    # Bake the beat-tracking checkpoint into the image (the transcription
    # weights come in via weights/, see README-cog note).
    - python -c "from beat_this.inference import Audio2Beats; Audio2Beats(checkpoint_path='final0', device='cpu', dbn=False)"
predict: "predict.py:Predictor"
